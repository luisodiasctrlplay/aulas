<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de personagem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabeçalho com o topo da ficha de personagem (Aula 10 - Imagem 06) -->
    <header class="topo">
        <section class="conteiner-topo">
            <div class="conteiner-nome-personagem">
                <p>Nome personagem</p>
                <input type="text">
            </div>
            <div class="conteiner-nome-jogador">
                <p>Nome jogador</p>
                <input type="text">
            </div>
            <div class="conteiner-pontos-xp">
                <p>Pontos de experiência</p>
                <input type="text">
            </div>
            <div class="conteiner-raca">
                <p>Raça</p>
                <input type="text">
            </div>
            <div class="conteiner-classe">
                <p>Classe</p>
                <input type="text">
            </div>
            <div class="conteiner-alinhamento">
                <p>Alinhamento</p>
                <input type="text">
            </div>
        </section>
    </header>

    <!-- Conteúdo principal da ficha (Imagem 02) -->
    <main class="conteiner-conteudo-principal">
        <section class="sessao-conteudo-principal">

            <!-- Coluna de modificadores: FOR, DES, CON, INT, SAB, CAR (Imagem 02) -->
            <div class="conteiner-modificadores">
                <div class="forca">
                    <p>FOR</p>
                    <input type="text">
                </div>
                <div class="destreza">
                    <p>DES</p>
                    <input type="text">
                </div>
                <div class="constituicao">
                    <p>CON</p>
                    <input type="text">
                </div>
                <div class="inteligencia">
                    <p>INT</p>
                    <input type="text">
                </div>
                <div class="sabedoria">
                    <p>SAB</p>
                    <input type="text">
                </div>
                <div class="carisma">
                    <p>CAR</p>
                    <input type="text">
                </div>
            </div>

            <!-- Coluna central: vida, defesa, velocidade e imagem (Imagem 03) -->
            <div class="conteiner-vdv-img">
                <div class="conteiner-vdv">
                    <div>
                        <p>Vida</p>
                        <input type="text">
                    </div>
                    <div>
                        <p>Defesa</p>
                        <input type="text">
                    </div>
                    <div>
                        <p>Velocidade</p>
                        <input type="text">
                    </div>
                </div>
                <div class="conteiner-img">
                    <img src="imgs/my_character.png" alt="Imagem do personagem">
                </div>
            </div>

            <!-- Coluna da biografia (Imagem 03) -->
            <div class="conteiner-biografia">
                <h2>Biografia</h2>
                <textarea cols="30" rows="25"></textarea>
            </div>

        </section>

        <!-- Seção de conteúdo secundário (Imagem 04) -->
        <section class="sessao-conteudo-secundario">
            <div class="conteiner-equipamento">
                <h2>Equipamentos</h2>
                <textarea cols="30" rows="10"></textarea>
            </div>
            <div class="conteiner-caracteristicas">
                <h2>Características</h2>
                <textarea cols="30" rows="10"></textarea>
            </div>
        </section>
    </main>

    <!-- Rodapé da página (Imagem 05) -->
    <footer>
        <div class="conteiner-rodape">
            🚀 <a href="">Ctrl + Play</a>
        </div>
    </footer>

</body>
</html>
